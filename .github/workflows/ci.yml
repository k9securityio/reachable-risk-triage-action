# CI + release gate for the action itself: shell lint, workflow lint, and a
# zizmor security audit over the action definition, the example caller, and
# this workflow. zizmor findings fail the build — a published action is a
# supply-chain artifact customers execute with secrets in scope.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read # checkout only

jobs:
  lint-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install check tools
        env:
          ACTIONLINT_VERSION: 1.7.10
          ZIZMOR_VERSION: 1.29.0
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q shellcheck
          bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) \
            "$ACTIONLINT_VERSION" /usr/local/bin
          pipx install "zizmor==${ZIZMOR_VERSION}"

      - name: make quick (shellcheck + actionlint + zizmor release gate)
        # The Makefile is the single source of truth for check commands and
        # their ignore flags; see the rationale comments there.
        env:
          GH_TOKEN: ${{ github.token }}
        run: make quick
